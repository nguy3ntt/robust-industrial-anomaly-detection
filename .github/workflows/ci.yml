name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --extra cpu --group dev --locked
      - run: uv run --extra cpu ruff format --check .
      - run: uv run --extra cpu ruff check .
      - run: uv run --extra cpu mypy src scripts
      - run: uv run --extra cpu pytest
