experiment:
  name: m11-encoder-comparison
  seed: 20260915
  bootstrap_samples: 1000
  confidence: 0.95
encoders: [resnet18, convnext_tiny]
datasets: [visa, ksdd2]
model:
  image_size: 224
  localization_size: 56
  batch_size: 16
  torch_threads: 4
  fit_normals_cap: 256
  bank_size: 512
  projected_dimension: 64
  candidate_limit: 4096
  patch_budget_per_image: 24
  image_score_fraction: 0.01
  gaussian_sigma: 4.0
calibration:
  anomaly_alpha: 0.05
  review_alpha: 0.20
  pixel_quantile: 0.995
sources:
  visa_config: configs/data/visa.yaml
  ksdd2_config: configs/data/ksdd2.yaml
  robustness_config: configs/experiments/m4-robustness.yaml
conditions: [clean, jpeg_severe, blur_severe, noise_severe, geometric_severe]
benchmark:
  normal_samples: 5
  anomaly_samples: 5
quick:
  train_normals: 24
  calibration_normals: 50
  test_normals: 12
  test_anomalies: 12
  bootstrap_samples: 50
