schema_version: 1

dataset:
  root: ${DEEPFAKE_DATA_ROOT}/faceforensicspp
  release: faceforensicspp-official-core-methods
  # Replace after the approved download is obtained. The builder deliberately
  # rejects a missing or non-ISO access date.
  access_date: PENDING

selection:
  # c23 is the first reproducible baseline tier. raw is about 500 GB and does
  # not fit the audited workstation's storage plan.
  compressions:
    - c23
  manipulation_methods:
    - Deepfakes
    - Face2Face
    - FaceSwap
    - NeuralTextures
  expected_counts:
    original: 1000
    Deepfakes: 1000
    Face2Face: 1000
    FaceSwap: 1000
    NeuralTextures: 1000

split:
  official_directory: faceforensicspp/splits
  # Optional CSV with sequence_id,identity_id columns. Do not claim identity
  # disjointness until an approved, verified mapping is supplied.
  identity_map: null
  require_complete_official_sources: true

integrity:
  checksum: sha256
  ffprobe: required
  workers: 4

output:
  directory: ${DEEPFAKE_DATA_ROOT}/manifests
  manifest: faceforensicspp-c23.jsonl
  audit: faceforensicspp-c23.audit.json
