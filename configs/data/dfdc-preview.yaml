schema_version: 1

dataset:
  root: ${DEEPFAKE_DATA_ROOT}/dfdc-preview
  metadata: ${DEEPFAKE_DATA_ROOT}/dfdc-preview/dataset.json
  release: dfdc-preview-official
  # Replace this only after personally accepting the live access agreement and
  # acquiring the official package.
  access_date: PENDING
  # The paper describes roughly 5,000 videos and 66 actors. The manifest also
  # requires an exact one-to-one match with every entry in dataset.json.
  minimum_records: 5000
  expected_identity_count: 66

split:
  # Meta's test identities remain test-only. Validation is derived solely from
  # disconnected identity groups in the provider training split.
  validation_fraction: 0.15
  seed: 20260914

integrity:
  checksum: sha256
  ffprobe: required
  workers: 4

output:
  directory: ${DEEPFAKE_DATA_ROOT}/manifests
  manifest: dfdc-preview.jsonl
  audit: dfdc-preview.audit.json
